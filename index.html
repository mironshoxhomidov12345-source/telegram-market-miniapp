<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Telefon Bozor O'zbekiston</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --badge-bg: #334155;
      --price-color: #38bdf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 12px;
      padding-bottom: 40px;
    }

    header {
      margin-bottom: 16px;
    }

    h1 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 12px;
      text-align: center;
    }

    .search-box {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 16px;
      color: var(--text-main);
      font-size: 15px;
      outline: none;
      margin-bottom: 12px;
    }

    .search-box::placeholder {
      color: var(--text-muted);
    }

    .listings-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
    }

    .image-container {
      width: 100%;
      height: 240px;
      background-color: #020617;
      position: relative;
    }

    .image-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .city-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(4px);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .card-body {
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .model-title {
      font-size: 18px;
      font-weight: 700;
    }

    .price {
      font-size: 20px;
      font-weight: 800;
      color: var(--price-color);
    }

    .specs-line {
      font-size: 13px;
      color: var(--text-muted);
    }

    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 4px 0;
    }

    .badge {
      background-color: var(--badge-bg);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 12px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .btn-contact {
      background-color: var(--accent);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 10px;
      text-align: center;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      margin-top: 4px;
      width: 100%;
    }

    .btn-contact:active {
      background-color: var(--accent-hover);
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <header>
    <h1>📱 Telefon Bozor O'zbekiston</h1>
    <input type="text" id="searchInput" class="search-box" placeholder="Model bo'yicha qidirish (masalan: 13 Pro)..." oninput="filterListings()">
  </header>

  <div id="listingsContainer" class="listings-grid">
    <div class="empty-state">Yuklanmoqda...</div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    const BACKEND_BASE = "https://telegram-bot-mwh4.onrender.com";
    let allListings = [];

    function contactSeller(contact) {
      if (!contact) {
        if (tg && tg.openTelegramLink) {
          tg.openTelegramLink("https://t.me/TELEFONBOZOROZBEKISTONBOT");
        } else {
          window.open("https://t.me/TELEFONBOZOROZBEKISTONBOT", "_blank");
        }
        return;
      }

      const clean = contact.replace('@', '').replace('+', '').trim();
      let url = "";

      // Если указан телефон или юзернейм
      if (/^\d+$/.test(clean)) {
        url = `https://t.me/+${clean}`;
      } else {
        url = `https://t.me/${clean}`;
      }

      if (tg && tg.openTelegramLink) {
        tg.openTelegramLink(url);
      } else {
        window.open(url, "_blank");
      }
    }

    async function loadListings() {
      try {
        const res = await fetch(`${BACKEND_BASE}/api/listings`);
        const data = await res.json();
        allListings = data;
        renderListings(allListings);
      } catch (err) {
        console.error(err);
        document.getElementById("listingsContainer").innerHTML = `
          <div class="empty-state">
            <p>E'lonlarni yuklashda xatolik yuz berdi.</p>
          </div>
        `;
      }
    }

    function renderListings(items) {
      const container = document.getElementById("listingsContainer");
      if (!items || items.length === 0) {
        container.innerHTML = `<div class="empty-state">Hozircha e'lonlar yo'q. Kanalga yangi post qo'shing!</div>`;
        return;
      }

      container.innerHTML = items.map(item => {
        let photo = item.photo_url || "";
        if (photo.startsWith("/api/")) {
          photo = `${BACKEND_BASE}${photo}`;
        }
        if (!photo) {
          photo = "https://images.unsplash.com/photo-1592750475338-74b7b21085ab?w=600&auto=format&fit=crop&q=80";
        }

        const safeContact = (item.contact || "").replace(/"/g, '&quot;');

        return `
          <div class="card">
            <div class="image-container">
              <img src="${photo}" alt="${item.model}">
              <div class="city-badge">📍 ${item.city || 'Toshkent'}</div>
            </div>
            <div class="card-body">
              <div class="header-row">
                <span class="model-title">${item.model}</span>
                <span class="price">$${item.price}</span>
              </div>
              <div class="specs-line">
                ${item.color ? item.color + ' • ' : ''}${item.storage}
              </div>
              <div class="badges">
                <span class="badge">🔋 ${item.battery}</span>
                <span class="badge">${item.has_box ? '📦 Karobka bor' : '❌ Karobkasiz'}</span>
                <span class="badge">⚙️ ${item.repairs}</span>
              </div>
              <button onclick="contactSeller('${safeContact}')" class="btn-contact">Sotuvchiga yozish →</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function filterListings() {
      const query = document.getElementById("searchInput").value.toLowerCase();
      const filtered = allListings.filter(item => 
        item.model.toLowerCase().includes(query) ||
        (item.storage && item.storage.toLowerCase().includes(query)) ||
        (item.city && item.city.toLowerCase().includes(query))
      );
      renderListings(filtered);
    }

    loadListings();
  </script>
</body>
</html>
