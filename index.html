<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Marketplace</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: var(--tg-theme-bg-color, #0f172a);
      color: var(--tg-theme-text-color, #f8fafc);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
  </style>
</head>
<body class="p-3 pb-20 select-none">
  <!-- Header -->
  <header class="mb-4 flex items-center justify-between">
    <div>
      <h1 class="text-xl font-bold tracking-tight">Qurilmalar bozori</h1>
      <p class="text-xs text-slate-400">Kanal bilan avto-sinxronizatsiya</p>
    </div>
    <span id="user-badge" class="text-xs bg-blue-600/30 text-blue-400 border border-blue-500/30 px-2 py-1 rounded-full font-medium">Mehmon</span>
  </header>

  <!-- Filters -->
  <section class="mb-4 space-y-2 bg-slate-800/60 p-3 rounded-2xl border border-slate-700/50 backdrop-blur-md">
    <div class="grid grid-cols-2 gap-2">
      <!-- City Filter -->
      <select id="filter-city" onchange="applyFilters()" class="bg-slate-900 border border-slate-700 text-xs rounded-xl p-2.5 focus:outline-none focus:border-blue-500 text-slate-200">
        <option value="all">Barcha shaharlar</option>
        <option value="Toshkent">Toshkent</option>
        <option value="Samarqand">Samarqand</option>
        <option value="Buxoro">Buxoro</option>
        <option value="Andijon">Andijon</option>
        <option value="Farg'ona">Farg'ona</option>
      </select>

      <!-- Storage Filter -->
      <select id="filter-storage" onchange="applyFilters()" class="bg-slate-900 border border-slate-700 text-xs rounded-xl p-2.5 focus:outline-none focus:border-blue-500 text-slate-200">
        <option value="all">Barcha xotiralar</option>
        <option value="64">64 GB</option>
        <option value="128">128 GB</option>
        <option value="256">256 GB</option>
        <option value="512">512 GB</option>
        <option value="1TB">1 TB</option>
      </select>
    </div>

    <!-- Checkbox: Box status -->
    <div class="flex items-center justify-between pt-1 px-1">
      <label class="text-xs text-slate-300 font-medium flex items-center gap-2 cursor-pointer">
        <input type="checkbox" id="filter-box" onchange="applyFilters()" class="w-4 h-4 rounded text-blue-600 bg-slate-900 border-slate-700 focus:ring-0">
        Faqat karobka borlar 📦
      </label>
      <button onclick="resetFilters()" class="text-xs text-blue-400 hover:underline">Tozalash</button>
    </div>
  </section>

  <!-- Items Feed -->
  <div id="catalog-container" class="space-y-3">
    <!-- Listings inject via JS -->
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      if (tg.initDataUnsafe?.user?.first_name) {
        document.getElementById('user-badge').textContent = tg.initDataUnsafe.user.first_name;
      }
    }

    // Default seed listings
    const mockListings = [
      {
        id: 1,
        brand: 'Apple',
        model: 'iPhone 13 Pro',
        storage: '256',
        color: 'Sierra Blue',
        battery: '87%',
        has_box: true,
        repairs: 'Ideal (ochilmagan)',
        price_usd: 620,
        city: 'Toshkent',
        contact: 'seller_example',
        photo: 'https://images.unsplash.com/photo-1632661674596-df8be070a5c5?w=600&auto=format&fit=crop&q=80'
      },
      {
        id: 2,
        brand: 'Apple',
        model: 'iPhone 12',
        storage: '128',
        color: 'Black',
        battery: '82%',
        has_box: false,
        repairs: 'Yangi batareya qo‘yilgan',
        price_usd: 370,
        city: 'Buxoro',
        contact: 'seller_example2',
        photo: 'https://images.unsplash.com/photo-1605236453806-6ff36851218e?w=600&auto=format&fit=crop&q=80'
      }
    ];

    let currentListings = [...mockListings];

    function renderListings(items) {
      const container = document.getElementById('catalog-container');
      if (items.length === 0) {
        container.innerHTML = `
          <div class="text-center py-12 text-slate-400">
            <p class="text-sm">Mos keladigan e'lonlar topilmadi</p>
          </div>`;
        return;
      }

      container.innerHTML = items.map(item => `
        <article class="bg-slate-800/80 border border-slate-700/60 rounded-2xl overflow-hidden shadow-lg flex flex-col">
          <div class="relative h-44 w-full bg-slate-900 overflow-hidden">
            <img src="${item.photo}" alt="${item.model}" class="w-full h-full object-cover">
            <span class="absolute top-2 right-2 bg-black/60 backdrop-blur-md text-white text-[11px] font-semibold px-2 py-0.5 rounded-lg border border-white/10">
              📍 ${item.city}
            </span>
          </div>

          <div class="p-3.5 flex flex-col flex-1 justify-between">
            <div>
              <div class="flex items-center justify-between">
                <h3 class="font-bold text-base text-slate-100">${item.model}</h3>
                <span class="text-emerald-400 font-extrabold text-base">$${item.price_usd}</span>
              </div>
              <p class="text-xs text-slate-400 mt-0.5">${item.color} • ${item.storage} GB</p>

              <!-- Badges -->
              <div class="flex flex-wrap gap-1.5 mt-2.5">
                <span class="text-[11px] bg-slate-700/70 border border-slate-600/50 px-2 py-0.5 rounded-md text-slate-300">
                  🔋 ${item.battery}
                </span>
                <span class="text-[11px] ${item.has_box ? 'bg-amber-900/30 text-amber-300 border-amber-500/30' : 'bg-slate-700/40 text-slate-400 border-slate-600/30'} border px-2 py-0.5 rounded-md">
                  ${item.has_box ? '📦 Karobka bor' : '❌ Karobkasiz'}
                </span>
                <span class="text-[11px] bg-slate-700/70 border border-slate-600/50 px-2 py-0.5 rounded-md text-slate-300 truncate max-w-[200px]">
                  ⚙️ ${item.repairs}
                </span>
              </div>
            </div>

            <!-- Action button -->
            <button onclick="openChat('${item.contact}')" class="mt-3.5 w-full bg-blue-600 active:scale-[0.98] transition hover:bg-blue-500 text-white font-medium py-2.5 rounded-xl text-xs flex items-center justify-center gap-2">
              <span>Sotuvchiga yozish</span>
              <span>→</span>
            </button>
          </div>
        </article>
      `).join('');
    }

    function applyFilters() {
      const city = document.getElementById('filter-city').value;
      const storage = document.getElementById('filter-storage').value;
      const boxOnly = document.getElementById('filter-box').checked;

      if (tg?.HapticFeedback) {
        tg.HapticFeedback.selectionChanged();
      }

      const filtered = currentListings.filter(item => {
        const matchesCity = (city === 'all') || (item.city === city);
        const matchesStorage = (storage === 'all') || (item.storage === storage);
        const matchesBox = !boxOnly || item.has_box;
        return matchesCity && matchesStorage && matchesBox;
      });

      renderListings(filtered);
    }

    function resetFilters() {
      document.getElementById('filter-city').value = 'all';
      document.getElementById('filter-storage').value = 'all';
      document.getElementById('filter-box').checked = false;
      renderListings(currentListings);
    }

    function openChat(username) {
      if (tg?.HapticFeedback) {
        tg.HapticFeedback.impactOccurred('medium');
      }
      if (tg?.openTelegramLink) {
        tg.openTelegramLink(`https://t.me/${username}`);
      } else {
        window.open(`https://t.me/${username}`, '_blank');
      }
    }

    // Initial render
    renderListings(currentListings);
  </script>
</body>
</html>
